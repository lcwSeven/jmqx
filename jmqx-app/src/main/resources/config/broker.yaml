# Broker network endpoints and TLS settings.
jmqx:
  broker:
    # MQTT TCP listener host/port.
    host: 0.0.0.0
    port: 1883
    # Netty thread model. workerThreads=0 means Netty default.
    bossThreads: 1
    workerThreads: 0
    # Read idle timeout in seconds. 0 means disabled.
    readerIdleSeconds: 120
    # Maximum QoS supported by broker (0/1/2).
    maxQos: 2
    # Skip loopback delivery when a client publishes to a topic it also subscribes to.
    publish:
      noLocalEnabled: true
    # Maximum number of topic subscriptions allowed per client.
    maxSubscriptionsPerClient: 1000
    # Maximum allowed WILL payload bytes. CONNECT is rejected when exceeded.
    maxWillPayloadBytes: 1048576
    # MQTT over WebSocket.
    websocket:
      enabled: true
      host: 0.0.0.0
      port: 8083
      path: /mqtt
    # MQTT over WebSocket TLS.
    wss:
      enabled: false
      host: 0.0.0.0
      port: 8084
      path: /mqtt
    # MQTT over TLS.
    mqtts:
      enabled: false
      host: 0.0.0.0
      port: 8883
    # TLS files shared by MQTTS and WSS.
    tls:
      certChainFile: ""
      privateKeyFile: ""
      privateKeyPassword: ""
    # Publish rate limit (per second), can be enabled by clientId and/or IP.
    rateLimit:
      # PUBLISH throttling by clientId.
      clientId:
        enabled: false
        perSecond: 0
      # PUBLISH throttling by source IP.
      ip:
        enabled: false
        perSecond: 0
      # PUBLISH limit algorithm: fixed_window / sliding_window / token_bucket.
      publish:
        strategy: fixed_window
      # CONNECT throttling for restart/reconnect storms.
      connect:
        enabled: false
        globalPerSecond: 0
        ipPerSecond: 0
        # CONNECT limit algorithm: fixed_window / sliding_window / token_bucket.
        strategy: fixed_window
      # Rate-limit state cleanup/eviction controls.
      cleanupIntervalSeconds: 60
      idleSeconds: 300
