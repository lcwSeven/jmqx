# Cluster role, metadata replication, and node-to-node transport.
jmqx:
  node:
    # Unique node id in current cluster.
    id: node-1
  cluster:
    # Node role: core or replicant.
    role: core
    # Core endpoints for metadata command forwarding.
    coreEndpoints: 127.0.0.1:7800
    # Core metadata service bind address.
    core:
      bindHost: 0.0.0.0
      port: 7800
    # Replication and request path tuning.
    netty:
      requestTimeoutMs: 3000
      reconnectBackoffMs: 1000
      ackBatchSize: 64
      ackFlushIntervalMs: 200
      replicantMaxInFlightEvents: 2048
      replicantPushBatchSize: 256
    # Delay before global route cleanup when one node is considered down.
    nodeDownCleanupDelayMs: 15000
    # Core replay buffer limit.
    replay:
      maxEvents: 200000
    # Cross-node publish transport bind address.
    message:
      bindHost: 0.0.0.0
      port: 7900
    # Static nodeId -> endpoint map for cross-node routing.
    nodeEndpoints: node-1=127.0.0.1:7900
    # Raft metadata consensus settings for Core nodes.
    raft:
      groupId: jmqx-metadata
      serverId: 127.0.0.1:17800
      initialConf: 127.0.0.1:17800
      dataPath: data/raft-metadata
      electionTimeoutMs: 1000
      snapshotIntervalSecs: 30
