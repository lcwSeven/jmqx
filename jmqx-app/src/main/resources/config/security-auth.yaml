# Client AUTH plugin chain and backend data source settings.
jmqx:
  auth:
    # Ordered auth chain. Empty means no auth provider, which allows all.
    chain: ""
    # Positive/negative auth cache ttl in milliseconds.
    cacheMillis: 60000
    # HTTP auth backend.
    http:
      method: POST
      url: http://127.0.0.1:8080/auth/check
      headers: "content-type: application/json"
      tlsEnabled: false
      bodyTemplate: |
        {
          "username": "${username}",
          "password": "${password}"
        }
      poolSize: 4
      rateLimitPerSecond: 0
      requestTimeoutMs: 2000
      connectTimeoutMs: 1500
      pipelineCount: 2
    # File auth backend.
    file:
      path: auth-users.txt
    # Built-in database auth backend.
    builtInDatabase:
      accountType: username
      passwordHashAlgorithm: sha256
      saltPosition: suffix
    # Redis auth backend.
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      db: 0
      keyPrefix: jmqx:auth
      timeoutMs: 2000
    # MySQL auth backend.
    mysql:
      url: jdbc:mysql://127.0.0.1:3306/jmqx
      user: root
      password: ""
      query: "SELECT password FROM mqtt_user WHERE username = ?"
      pool:
        minIdle: 1
        maxSize: 8
        connectionTimeoutMs: 3000
        idleTimeoutMs: 60000
        maxLifetimeMs: 600000
    # PostgreSQL auth backend.
    postgresql:
      url: jdbc:postgresql://127.0.0.1:5432/jmqx
      user: postgres
      password: ""
      query: "SELECT password FROM mqtt_user WHERE username = ?"
      pool:
        minIdle: 1
        maxSize: 8
        connectionTimeoutMs: 3000
        idleTimeoutMs: 60000
        maxLifetimeMs: 600000
