# 30w connection benchmark profile for single-node jmqx.
# Use this as an override template in pressure test environments.

# Broker endpoints
jmqx.broker.host=0.0.0.0
jmqx.broker.port=1883
jmqx.broker.mqtts.enabled=false
jmqx.broker.websocket.enabled=false
jmqx.broker.wss.enabled=false

# Keep network path minimal for large connection counts
jmqx.broker.bossThreads=1
jmqx.broker.workerThreads=0
jmqx.broker.readerIdleSeconds=180

# Retained feature disabled for large-scale connection baseline
jmqx.retained.enabled=false

# Shared subscription safe defaults
jmqx.shared.maxSubscribersPerGroup=1000
jmqx.shared.slowConsumerStrikeThreshold=3

# Disable bridge in baseline benchmark
jmqx.bridge.enabled=false

# Auth/ACL choose low-overhead mode for baseline capacity verification
jmqx.auth.type=allow_all
jmqx.auth.chain=
jmqx.auth.cacheMillis=0

jmqx.acl.type=allow_all
jmqx.acl.defaultAllow=true
jmqx.acl.cacheMillis=0
