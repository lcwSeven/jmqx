# 30w connection benchmark profile for single-node jmqx.
# Use this as an override template in pressure test environments.

# Broker endpoints
jmqx.broker.host=0.0.0.0
jmqx.broker.port=1883
jmqx.broker.mqtts.enabled=false
jmqx.broker.websocket.enabled=false
jmqx.broker.wss.enabled=false

# Keep network path minimal for large connection counts
jmqx.broker.bossThreads=1
jmqx.broker.workerThreads=0
jmqx.broker.readerIdleSeconds=180

# Retained feature disabled for large-scale connection baseline
jmqx.retained.enabled=false
# QoS1 downlink inflight persistence path
jmqx.qos1.inflight.rocksdb.path=data/qos1-inflight-rocksdb
# QoS2 inflight persistence path
jmqx.qos2.inflight.rocksdb.path=data/qos2-inflight-rocksdb

# Shared subscription safe defaults
jmqx.shared.maxSubscribersPerGroup=1000
jmqx.shared.slowConsumerStrikeThreshold=3

# Single node runs as CORE for local metadata writes
jmqx.cluster.role=core
jmqx.cluster.coreEndpoints=127.0.0.1:7800
jmqx.cluster.core.bindHost=0.0.0.0
jmqx.cluster.core.port=7800
jmqx.cluster.netty.requestTimeoutMs=3000
jmqx.cluster.netty.reconnectBackoffMs=1000
jmqx.cluster.netty.ackBatchSize=64
jmqx.cluster.netty.ackFlushIntervalMs=200
jmqx.cluster.netty.replicantMaxInFlightEvents=2048
jmqx.cluster.netty.replicantPushBatchSize=256
jmqx.cluster.nodeDownCleanupDelayMs=15000
jmqx.cluster.message.bindHost=0.0.0.0
jmqx.cluster.message.port=7900
jmqx.cluster.nodeEndpoints=node-1=127.0.0.1:7900
jmqx.cluster.replay.maxEvents=200000
jmqx.cluster.raft.groupId=jmqx-metadata
jmqx.cluster.raft.serverId=127.0.0.1:17800
jmqx.cluster.raft.initialConf=127.0.0.1:17800
jmqx.cluster.raft.dataPath=data/raft-metadata
jmqx.cluster.raft.electionTimeoutMs=1000
jmqx.cluster.raft.snapshotIntervalSecs=30

# Disable bridge in baseline benchmark
jmqx.bridge.enabled=false
# Bridge topic filters, empty means bridge all non-dashboard topics when bridge is enabled
jmqx.bridge.topicFilters=
# Per target source topic filters (empty means no extra per-target filter)
jmqx.bridge.kafka.sourceTopicFilters=
jmqx.bridge.rocketmq.sourceTopicFilters=
jmqx.bridge.mysql.sourceTopicFilters=

# Auth/ACL choose low-overhead mode for baseline capacity verification
jmqx.auth.type=allow_all
jmqx.auth.chain=
jmqx.auth.cacheMillis=0

jmqx.acl.type=allow_all
jmqx.acl.defaultAllow=true
jmqx.acl.cacheMillis=0
