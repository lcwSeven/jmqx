# Broker
# MQTT plain TCP bind host
jmqx.broker.host=0.0.0.0
# MQTT plain TCP bind port
jmqx.broker.port=1883
# Enable MQTTS (MQTT over TLS)
jmqx.broker.mqtts.enabled=false
# MQTTS bind host
jmqx.broker.mqtts.host=0.0.0.0
# MQTTS bind port
jmqx.broker.mqtts.port=8883
# Netty boss thread count
jmqx.broker.bossThreads=1
# Netty worker thread count, 0 means Netty default
jmqx.broker.workerThreads=0
# Read idle timeout in seconds, 0 means disabled
jmqx.broker.readerIdleSeconds=120
# Enable WS (MQTT over WebSocket)
jmqx.broker.websocket.enabled=true
# WS bind host
jmqx.broker.websocket.host=0.0.0.0
# WS bind port
jmqx.broker.websocket.port=8083
# WS handshake path
jmqx.broker.websocket.path=/mqtt
# Enable WSS (MQTT over WebSocket TLS)
jmqx.broker.wss.enabled=false
# WSS bind host
jmqx.broker.wss.host=0.0.0.0
# WSS bind port
jmqx.broker.wss.port=8084
# WSS handshake path
jmqx.broker.wss.path=/mqtt

# TLS files for MQTTS/WSS
# TLS certificate chain file path (PEM)
jmqx.broker.tls.certChainFile=
# TLS private key file path (PEM)
jmqx.broker.tls.privateKeyFile=
# TLS private key password (empty if no password)
jmqx.broker.tls.privateKeyPassword=

# Retained store
# Enable retained message feature
jmqx.retained.enabled=true
# RocksDB data directory
jmqx.retained.rocksdb.path=data/retained-rocksdb
# Max retained hot-cache entries
jmqx.retained.maxEntries=100000
# Max retained hot-cache bytes
jmqx.retained.maxBytes=268435456
# Max payload bytes for one retained message
jmqx.retained.maxPayloadBytes=1048576
# Overflow strategy: evict_lru or reject_new
jmqx.retained.overflowStrategy=evict_lru

# Shared subscription manager
# Max shared subscribers allowed per group
jmqx.shared.maxSubscribersPerGroup=1000
# Slow consumer strike threshold before eviction
jmqx.shared.slowConsumerStrikeThreshold=3

# Auth plugin
# Auth type: allow_all/http/file/redis/db
jmqx.auth.type=allow_all
# Auth chain order, comma separated (empty means disabled)
jmqx.auth.chain=
# Auth cache ttl in milliseconds
jmqx.auth.cacheMillis=60000


# Auth HTTP endpoint
jmqx.auth.http.url=http://127.0.0.1:8080/auth/check
# Auth HTTP timeout in milliseconds
jmqx.auth.http.timeoutMs=2000


# Auth file path
jmqx.auth.file.path=auth-users.txt

# Auth Redis Config ###
# Auth Redis host
jmqx.auth.redis.host=127.0.0.1
# Auth Redis port
jmqx.auth.redis.port=6379
# Auth Redis password
jmqx.auth.redis.password=
# Auth Redis database index
jmqx.auth.redis.db=0
# Auth Redis key prefix
jmqx.auth.redis.keyPrefix=jmqx:auth
# Auth Redis timeout in milliseconds
jmqx.auth.redis.timeoutMs=2000

# Auth DB Config ####
# Auth DB JDBC driver class
jmqx.auth.db.driver=
# Auth DB JDBC URL
jmqx.auth.db.url=jdbc:mysql://127.0.0.1:3306/jmqx
# Auth DB username
jmqx.auth.db.user=root
# Auth DB password
jmqx.auth.db.password=
# Auth DB query SQL
jmqx.auth.db.query=SELECT password FROM mqtt_user WHERE username = ?

# ACL plugin
# ACL type: allow_all/http/redis/file
jmqx.acl.type=allow_all
# ACL default allow when plugin misses
jmqx.acl.defaultAllow=false
# ACL cache ttl in milliseconds
jmqx.acl.cacheMillis=60000

# ACL HTTP
# ACL HTTP endpoint
jmqx.acl.http.url=http://127.0.0.1:8080/acl/check
# ACL HTTP timeout in milliseconds
jmqx.acl.http.timeoutMs=2000

# ACL Redis Config
# ACL Redis host
jmqx.acl.redis.host=127.0.0.1
# ACL Redis port
jmqx.acl.redis.port=6379
# ACL Redis password
jmqx.acl.redis.password=
# ACL Redis database index
jmqx.acl.redis.db=0
# ACL Redis key prefix
jmqx.acl.redis.keyPrefix=jmqx:acl
# ACL Redis timeout in milliseconds
jmqx.acl.redis.timeoutMs=2000

# ACL file
# ACL rule file path
jmqx.acl.file.path=acl-rules.txt

# Message bridge
# Enable message bridge
jmqx.bridge.enabled=false
# Bridge targets, comma separated: kafka/rocketmq/mysql
jmqx.bridge.types=kafka,rocketmq,mysql
# Enable async bridge pipeline
jmqx.bridge.async=true
# Async bridge queue capacity
jmqx.bridge.async.queueCapacity=10000
# Async bridge worker threads
jmqx.bridge.async.workerCount=1

# Bridge Kafka
# Kafka bootstrap servers
jmqx.bridge.kafka.bootstrapServers=127.0.0.1:9092
# Kafka target topic
jmqx.bridge.kafka.topic=jmqx-messages
# Kafka acks mode
jmqx.bridge.kafka.acks=1
# Kafka client id
jmqx.bridge.kafka.clientId=jmqx-bridge
# Kafka compression type
jmqx.bridge.kafka.compressionType=none

# Bridge RocketMQ
# RocketMQ name server
jmqx.bridge.rocketmq.nameServer=127.0.0.1:9876
# RocketMQ producer group
jmqx.bridge.rocketmq.producerGroup=jmqx-bridge-group
# RocketMQ target topic
jmqx.bridge.rocketmq.topic=JMQX_MESSAGES
# RocketMQ sync send flag
jmqx.bridge.rocketmq.syncSend=false
# RocketMQ send timeout in milliseconds
jmqx.bridge.rocketmq.timeoutMs=3000

# Bridge MySQL
# MySQL JDBC driver class for bridge
jmqx.bridge.mysql.driver=
# MySQL JDBC URL for bridge
jmqx.bridge.mysql.url=jdbc:mysql://127.0.0.1:3306/jmqx
# MySQL username for bridge
jmqx.bridge.mysql.user=root
# MySQL password for bridge
jmqx.bridge.mysql.password=
# MySQL table name for bridge
jmqx.bridge.mysql.table=jmqx_bridge_message
# Auto create bridge table on startup
jmqx.bridge.mysql.autoCreateTable=true
