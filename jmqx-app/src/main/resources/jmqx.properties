# Broker
jmqx.broker.host=0.0.0.0
jmqx.broker.port=1883
jmqx.broker.bossThreads=1
jmqx.broker.workerThreads=0
jmqx.broker.readerIdleSeconds=120
jmqx.broker.websocket.enabled=true
jmqx.broker.websocket.host=0.0.0.0
jmqx.broker.websocket.port=8083
jmqx.broker.websocket.path=/mqtt

# Node Admin API
jmqx.nodeAdmin.enabled=true
jmqx.nodeAdmin.host=0.0.0.0
jmqx.nodeAdmin.port=28083

# Cluster
jmqx.cluster.enabled=false
jmqx.cluster.nodeId=node-1
jmqx.cluster.role=MASTER
jmqx.cluster.busType=local
jmqx.cluster.seedNodes=

# Auth plugin
jmqx.auth.type=allow_all
jmqx.auth.chain=
jmqx.auth.cacheMillis=60000

# Auth http
jmqx.auth.http.url=http://127.0.0.1:8080/auth/check
jmqx.auth.http.timeoutMs=2000

# Auth file
jmqx.auth.file.path=auth-users.txt

# Auth redis
jmqx.auth.redis.host=127.0.0.1
jmqx.auth.redis.port=6379
jmqx.auth.redis.password=
jmqx.auth.redis.db=0
jmqx.auth.redis.keyPrefix=jmqx:auth
jmqx.auth.redis.timeoutMs=2000

# Auth db
jmqx.auth.db.driver=
jmqx.auth.db.url=jdbc:mysql://127.0.0.1:3306/jmqx
jmqx.auth.db.user=root
jmqx.auth.db.password=
jmqx.auth.db.query=SELECT password FROM mqtt_user WHERE username = ?

# ACL plugin
jmqx.acl.type=allow_all
jmqx.acl.defaultAllow=false
jmqx.acl.cacheMillis=60000

# ACL http
jmqx.acl.http.url=http://127.0.0.1:8080/acl/check
jmqx.acl.http.timeoutMs=2000

# ACL redis
jmqx.acl.redis.host=127.0.0.1
jmqx.acl.redis.port=6379
jmqx.acl.redis.password=
jmqx.acl.redis.db=0
jmqx.acl.redis.keyPrefix=jmqx:acl
jmqx.acl.redis.timeoutMs=2000

# ACL file
jmqx.acl.file.path=acl-rules.txt

# Message bridge
jmqx.bridge.enabled=false
jmqx.bridge.types=kafka,rocketmq,mysql
jmqx.bridge.async=true
jmqx.bridge.async.queueCapacity=10000
jmqx.bridge.async.workerCount=1

# Bridge kafka
jmqx.bridge.kafka.bootstrapServers=127.0.0.1:9092
jmqx.bridge.kafka.topic=jmqx-messages
jmqx.bridge.kafka.acks=1
jmqx.bridge.kafka.clientId=jmqx-bridge
jmqx.bridge.kafka.compressionType=none

# Bridge rocketmq
jmqx.bridge.rocketmq.nameServer=127.0.0.1:9876
jmqx.bridge.rocketmq.producerGroup=jmqx-bridge-group
jmqx.bridge.rocketmq.topic=JMQX_MESSAGES
jmqx.bridge.rocketmq.syncSend=false
jmqx.bridge.rocketmq.timeoutMs=3000

# Bridge mysql
jmqx.bridge.mysql.driver=
jmqx.bridge.mysql.url=jdbc:mysql://127.0.0.1:3306/jmqx
jmqx.bridge.mysql.user=root
jmqx.bridge.mysql.password=
jmqx.bridge.mysql.table=jmqx_bridge_message
jmqx.bridge.mysql.autoCreateTable=true
