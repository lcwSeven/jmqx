# JMQX override layer (YAML)
# This file is loaded after module configs in /config/*.yaml.
# Keep only environment-specific overrides here.

# Example:
# jmqx:
#   node:
#     id: node-dev-1
#   cluster:
#     role: core
#     coreEndpoints: 127.0.0.1:7800
#   broker:
#     port: 1883
#     websocket:
#       port: 8083
#     rateLimit:
#       clientId:
#         enabled: true
#         perSecond: 300
#       ip:
#         enabled: false
#         perSecond: 0
#       connect:
#         enabled: true
#         globalPerSecond: 200
#         ipPerSecond: 20
#   auth:
#     type: allow_all
#   acl:
#     type: allow_all
