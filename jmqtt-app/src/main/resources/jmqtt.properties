# Broker
jmqtt.broker.host=0.0.0.0
jmqtt.broker.port=1883
jmqtt.broker.bossThreads=1
jmqtt.broker.workerThreads=0
jmqtt.broker.readerIdleSeconds=120
jmqtt.broker.websocket.enabled=true
jmqtt.broker.websocket.host=0.0.0.0
jmqtt.broker.websocket.port=8083
jmqtt.broker.websocket.path=/mqtt

# Admin
jmqtt.admin.enabled=true
jmqtt.admin.host=0.0.0.0
jmqtt.admin.port=18083

# Cluster
jmqtt.cluster.enabled=false
jmqtt.cluster.nodeId=node-1
jmqtt.cluster.role=MASTER
jmqtt.cluster.busType=local
jmqtt.cluster.seedNodes=

# Auth plugin
jmqtt.auth.type=allow_all
jmqtt.auth.cacheMillis=60000

# Auth http
jmqtt.auth.http.url=http://127.0.0.1:8080/auth/check
jmqtt.auth.http.timeoutMs=2000

# Auth file
jmqtt.auth.file.path=auth-users.txt

# Auth redis
jmqtt.auth.redis.host=127.0.0.1
jmqtt.auth.redis.port=6379
jmqtt.auth.redis.password=
jmqtt.auth.redis.db=0
jmqtt.auth.redis.keyPrefix=jmqtt:auth
jmqtt.auth.redis.timeoutMs=2000

# Auth db
jmqtt.auth.db.driver=
jmqtt.auth.db.url=jdbc:mysql://127.0.0.1:3306/jmqtt
jmqtt.auth.db.user=root
jmqtt.auth.db.password=
jmqtt.auth.db.query=SELECT password FROM mqtt_user WHERE username = ?

# ACL plugin
jmqtt.acl.type=allow_all
jmqtt.acl.defaultAllow=false
jmqtt.acl.cacheMillis=60000

# ACL http
jmqtt.acl.http.url=http://127.0.0.1:8080/acl/check
jmqtt.acl.http.timeoutMs=2000

# ACL redis
jmqtt.acl.redis.host=127.0.0.1
jmqtt.acl.redis.port=6379
jmqtt.acl.redis.password=
jmqtt.acl.redis.db=0
jmqtt.acl.redis.keyPrefix=jmqtt:acl
jmqtt.acl.redis.timeoutMs=2000

# ACL file
jmqtt.acl.file.path=acl-rules.txt
